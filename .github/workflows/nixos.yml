name: NixOS
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      changed: ${{ steps.changed.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check for relevant changes
        id: changed
        run: |
          # Manual dispatch always builds.
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PATTERN='^(hosts/nixos|modules/nixos|lib|pkgs|overlays)/|^flake\.(nix|lock)$|^\.github/workflows/nixos\.yml$'
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="$(git rev-parse HEAD^ 2>/dev/null || echo '')"
          fi
          if [ -z "$BASE" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE" HEAD | grep -Eq "$PATTERN"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Discover NixOS configs
        id: matrix
        run: |
          set -euo pipefail
          nix eval --json '.#nixosConfigurations' \
            --apply 'x: builtins.mapAttrs (n: v: v.pkgs.system) x' > systems.json
          # Hosts with a deploy-rs node build their activatable profile instead of
          # the bare toplevel. That profile's closure contains the toplevel (plus
          # the `activate-rs`/activation scripts `deploy` installs), so it is a
          # strict superset and validates the same artefact deploy's own
          # pre-check (`nix flake check`) covers. Hosts without a node (duende)
          # fall back to the toplevel.
          nix eval --json '.#deploy.nodes' --apply builtins.attrNames > deploy-nodes.json
          jq -c --slurpfile deploy deploy-nodes.json 'to_entries | map(
              .key as $host | .value as $system |
              {
                host: $host,
                system: $system,
                attr: (
                  if ($deploy[0] | index($host)) != null
                  then ".#deploy.nodes.\($host).profiles.system.path"
                  else ".#nixosConfigurations.\($host).config.system.build.toplevel"
                  end
                ),
                runner: (
                  if $system == "x86_64-linux" then "ubuntu-latest"
                  elif $system == "aarch64-linux" then "ubuntu-24.04-arm"
                  elif $system == "aarch64-darwin" then "macos-latest"
                  else error("unsupported system: " + $system)
                  end
                )
              })' systems.json > matrix.json
          [ -s matrix.json ] || { echo "matrix is empty — nix eval failed" >&2; exit 1; }
          echo "matrix=$(cat matrix.json)" >> "$GITHUB_OUTPUT"

  build:
    needs: discover
    if: needs.discover.outputs.changed == 'true'
    name: Build NixOS (${{ matrix.host }} · ${{ matrix.system }})
    strategy:
      # Let every host report its own result instead of cancelling the rest.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Free up space
        run: bash .github/scripts/space_cleanup.sh
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: cachix/cachix-action@v17
        with:
          name: davsanchez
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build NixOS config (${{ matrix.host }})
        run: nix build --keep-going "${{ matrix.attr }}"

  check:
    name: 🟢 NixOS builds successes required
    if: always()
    needs:
      # discover must be listed here: it evaluates the configs, so when it fails
      # GitHub skips `build`, and without it in `needs` this gate would only see
      # a skipped build and wrongly report success (masking the eval failure).
      - discover
      - build
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
          # build is skipped when no relevant files changed (git-diff gate);
          # that's a legitimate "nothing to build" state, not a failure.
          allowed-skips: build
