name: Flake Check
on:
  workflow_dispatch:
  push:
    branches:
      - master
      - renovate/**
    paths:
      - '**.nix'
      - 'flake.lock'
      - '.github/workflows/flake-check.yml'
  pull_request:
    paths:
      - '**.nix'
      - 'flake.lock'
      - '.github/workflows/flake-check.yml'

jobs:
  flake-check:
    name: nix flake check (${{ matrix.system }})
    strategy:
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
          - system: aarch64-darwin
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Free up space
        if: runner.os == 'Linux'
        run: bash .github/scripts/space_cleanup.sh
      - name: Set up QEMU binfmt for cross-build
        if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: ${{ matrix.system == 'x86_64-linux' && 'arm64' || 'amd64' }}
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            extra-platforms = aarch64-linux x86_64-linux
      - uses: cachix/cachix-action@v17
        with:
          name: davsanchez
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Activate bootstrap Linux builder
        if: matrix.system == 'aarch64-darwin'
        run: >
          sudo nix run
          --access-tokens "${{ secrets.GITHUB_TOKEN }}"
          --extra-experimental-features 'nix-command flakes'
          github:nix-darwin/nix-darwin/master#darwin-rebuild
          --
          switch --flake .#linux-builder-bootstrap

      - name: Wait for Linux builder
        if: matrix.system == 'aarch64-darwin'
        run: |
          set +e
          sleep 30
          for i in $(seq 1 12); do
            echo "Attempt $i/12: building trivial aarch64-linux derivation..."
            nix build --system aarch64-linux \
              --expr 'builtins.derivation { name = "smoke-test"; system = "aarch64-linux"; builder = "/bin/sh"; args = ["-c" "echo ok > $out"]; }' \
              --no-link 2>&1
            if [ $? -eq 0 ]; then
              echo "Linux builder is responsive"
              exit 0
            fi
            echo "Attempt $i failed, waiting 5s for VM to boot..."
            sleep 5
          done
          echo "Linux builder failed to become responsive"
          exit 1

      - name: Upgrade Linux builder with x86_64 support
        if: matrix.system == 'aarch64-darwin'
        run: >
          sudo nix run
          --access-tokens "${{ secrets.GITHUB_TOKEN }}"
          --extra-experimental-features 'nix-command flakes'
          github:nix-darwin/nix-darwin/master#darwin-rebuild
          --
          switch --flake .#linux-builder-with-x86_64

      - name: Run nix flake check
        run: nix flake check -L

  check:
    name: 🟢 Decide whether the needed jobs succeeded or failed
    if: always()
    needs:
      - flake-check
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
