name: Flake Check
on:
  workflow_dispatch:
  push:
    branches:
      - master
      - renovate/**
    paths:
      - '**.nix'
      - 'flake.lock'
      - '.github/workflows/flake-check.yml'
  pull_request:
    paths:
      - '**.nix'
      - 'flake.lock'
      - '.github/workflows/flake-check.yml'

jobs:
  flake-check:
    name: nix flake check (${{ matrix.system }})
    strategy:
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
          - system: aarch64-darwin
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Free up space
        run: bash .github/scripts/space_cleanup.sh
      - name: Set up QEMU binfmt for cross-build
        if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: ${{ matrix.system == 'x86_64-linux' && 'arm64' || 'amd64' }}
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            extra-platforms = aarch64-linux x86_64-linux
      - uses: cachix/cachix-action@v17
        with:
          name: davsanchez
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Run nix flake check
        if: matrix.system != 'aarch64-darwin'
        run: nix flake check -L --keep-going

      - name: Run darwin checks
        if: matrix.system == 'aarch64-darwin'
        run: |
          checks=$(nix eval --raw '.#checks.aarch64-darwin' --apply 'x: builtins.concatStringsSep " " (builtins.attrNames x)')
          for c in $checks; do
            [ "$c" = "deploy-activate" ] && continue
            nix build -L --keep-going ".#checks.aarch64-darwin.$c"
          done

  check:
    name: 🟢 Flake Checks successes required
    if: always()
    needs:
      - flake-check
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
