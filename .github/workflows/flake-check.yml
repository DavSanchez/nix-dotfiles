name: Flake Check
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master

jobs:
  changed:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check for flake-relevant changes
        id: diff
        run: |
          # Manual dispatch always runs the full check.
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PATTERN='\.nix$|^flake\.lock$|^\.github/workflows/flake-check\.yml$'
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="$(git rev-parse HEAD^ 2>/dev/null || echo '')"
          fi
          if [ -z "$BASE" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE" HEAD | grep -Eq "$PATTERN"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  flake-check:
    needs: changed
    if: needs.changed.outputs.changed == 'true'
    name: nix flake check (${{ matrix.system }})
    strategy:
      # Let every system report its own result instead of cancelling the rest.
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
          - system: aarch64-darwin
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Free up space
        run: bash .github/scripts/space_cleanup.sh
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: cachix/cachix-action@v17
        with:
          name: davsanchez
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Evaluate flake outputs
        if: runner.os == 'Linux'
        run: nix flake check -L --no-build

      # Each runner builds its own system's checks natively, one by one. The
      # aggregate `deploy-activate` spans every node, so it would make a runner
      # build the other architecture's closures (Pi kernels) under emulation;
      # the per-node `deploy-activate-<node>` checks cover those natively instead.
      # `deploy-schema` spans every node too (its `deploy.json` embeds each
      # node's profile path), so it can't be built by a single-platform runner
      # either; it runs in its own job once this matrix has published the
      # closures, see below.
      - name: Run per-system checks
        env:
          SYSTEM: ${{ matrix.system }}
        run: |
          checks=$(nix eval --raw ".#checks.$SYSTEM" --apply 'x: builtins.concatStringsSep " " (builtins.attrNames x)')
          for c in $checks; do
            [ "$c" = "deploy-activate" ] || [ "$c" = "deploy-schema" ] && continue
            nix build -L --keep-going ".#checks.$SYSTEM.$c"
          done

  # deploy-rs' jsonschema check builds a `deploy.json` whose `path` fields are
  # the nodes' `profiles.system.path` derivations, so it realises every node's
  # closure — including the other Linux architecture's activate scripts, which
  # no single-platform runner can build. Sequencing it after the matrix makes it
  # deterministic: `deploy-activate-<node>` has already built and pushed each
  # node's closure to Cachix by then, so this only has to substitute them (and
  # build the per-runner wrappers). Running it inside the matrix instead made it
  # a race: whichever runner reached the check first tried to build the other
  # architecture's closure and failed with a platform mismatch.
  deploy-schema:
    needs:
      - changed
      - flake-check
    # Skip when nothing flake-relevant changed, and when the matrix failed:
    # a red matrix already blocks the PR, and its closures may not be published.
    if: needs.changed.outputs.changed == 'true' && needs.flake-check.result == 'success'
    name: deploy-schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Free up space
        run: bash .github/scripts/space_cleanup.sh
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: cachix/cachix-action@v17
        with:
          name: davsanchez
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Validate the deploy output
        run: nix build -L .#checks.x86_64-linux.deploy-schema

  check:
    name: 🟢 Flake Checks successes required
    if: always()
    needs:
      - changed
      - flake-check
      - deploy-schema
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
          # flake-check and deploy-schema are skipped when no .nix/flake.lock
          # changed; that's a legitimate "nothing to check" state, not a failure.
          allowed-skips: flake-check deploy-schema
