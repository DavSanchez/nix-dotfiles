name: Update packages

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

env:
  EXCLUDE_PACKAGES: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Discover packages
        id: discover
        run: |
          set -euo pipefail

          # Evaluate each package in one system it is actually exposed for, so
          # packages that only exist on, say, aarch64-linux are still handled.
          # `nix flake show` flattens that away; group by name and pick a stable
          # probe system instead.
          nix flake show --json 2>/dev/null \
            | jq -r '
                .packages as $packages
                | [ $packages | to_entries[] | .key as $system | .value | keys[] | { name: ., system: $system } ]
                | group_by(.name)
                | map(
                    . as $entries
                    | ([$entries[].system]
                       | if index("x86_64-linux") then "x86_64-linux"
                         elif index("aarch64-linux") then "aarch64-linux"
                         elif index("aarch64-darwin") then "aarch64-darwin"
                         else .[0]
                         end) as $probe
                    | "\($entries[0].name)\t\($probe)"
                  )
                | .[]' > "$RUNNER_TEMP/packages.tsv"

          EXCLUDE="${{ env.EXCLUDE_PACKAGES }}"
          is_excluded() {
            [ -n "$EXCLUDE" ] || return 1
            printf '%s\n' "$EXCLUDE" | tr ',' '\n' | tr -d ' ' | grep -qxF "$1"
          }

          MATRIX="[]"
          while IFS=$'\t' read -r pkg system; do
            [ -n "$pkg" ] || continue

            if is_excluded "$pkg"; then
              echo "skip $pkg: listed in EXCLUDE_PACKAGES" >&2
              continue
            fi

            # Only source packages carry a `version` nix-update can bump. Generated
            # outputs — the per-host *-sd-image builds, for instance — do not, and
            # would otherwise make the update job fail on a missing attribute.
            if ! nix eval --raw ".#packages.${system}.${pkg}.version" >/dev/null 2>&1; then
              echo "skip $pkg: no version attribute (not a nix-update-able package)" >&2
              continue
            fi

            # Pick the runner from the package's declared platforms; fall back to the
            # runner for the system we probed when the package declares none (it is
            # then buildable everywhere, so either Linux or macOS would do).
            case "$system" in
              aarch64-linux) DEFAULT_RUNNER="ubuntu-24.04-arm" ;;
              x86_64-linux) DEFAULT_RUNNER="ubuntu-latest" ;;
              *) DEFAULT_RUNNER="macos-latest" ;;
            esac

            PLATFORMS=$(nix eval --json ".#packages.${system}.${pkg}.meta.platforms" 2>/dev/null || echo '[]')
            if echo "$PLATFORMS" | jq -e 'any(startswith("x86_64-linux") or startswith("i686-linux"))' > /dev/null; then
              RUNNER="ubuntu-latest"
            elif echo "$PLATFORMS" | jq -e 'any(startswith("aarch64-linux") or startswith("armv"))' > /dev/null; then
              RUNNER="ubuntu-24.04-arm"
            elif echo "$PLATFORMS" | jq -e 'any(. == "aarch64-darwin" or startswith("x86_64-darwin"))' > /dev/null; then
              RUNNER="macos-latest"
            else
              RUNNER="$DEFAULT_RUNNER"
            fi

            MATRIX=$(echo "$MATRIX" | jq -c --arg pkg "$pkg" --arg runner "$RUNNER" '. + [{"package": $pkg, "runner": $runner}]')
          done < "$RUNNER_TEMP/packages.tsv"

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "Discovered matrix: $MATRIX"

  update:
    needs: discover
    if: needs.discover.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.discover.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install nix-update
        run: nix profile add nixpkgs#nix-update

      - name: Capture current package revision
        id: previous
        run: |
          if [ "${{ matrix.runner }}" = "macos-latest" ]; then
            SYSTEM="aarch64-darwin"
          elif [ "${{ matrix.runner }}" = "ubuntu-24.04-arm" ]; then
            SYSTEM="aarch64-linux"
          else
            SYSTEM="x86_64-linux"
          fi

          PACKAGE="${{ matrix.package }}"
          VERSION=$(nix eval --raw ".#packages.${SYSTEM}.${PACKAGE}.version")
          REVISION=$(nix eval --raw ".#packages.${SYSTEM}.${PACKAGE}.src.rev" 2>/dev/null || echo "$VERSION")
          HOMEPAGE=$(nix eval --raw ".#packages.${SYSTEM}.${PACKAGE}.meta.homepage" 2>/dev/null || true)

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
          echo "homepage=$HOMEPAGE" >> "$GITHUB_OUTPUT"

      - name: Update ${{ matrix.package }}
        run: |
          if [ "${{ matrix.runner }}" = "macos-latest" ]; then
            SYSTEM="aarch64-darwin"
          elif [ "${{ matrix.runner }}" = "ubuntu-24.04-arm" ]; then
            SYSTEM="aarch64-linux"
          else
            SYSTEM="x86_64-linux"
          fi
          echo "Updating ${{ matrix.package }} for system $SYSTEM"
          nix-update --flake --system "$SYSTEM" --build ${{ matrix.package }}

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare pull request description
        if: steps.changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE: ${{ matrix.package }}
          OLD_VERSION: ${{ steps.previous.outputs.version }}
          OLD_REVISION: ${{ steps.previous.outputs.revision }}
          HOMEPAGE: ${{ steps.previous.outputs.homepage }}
        run: |
          if [ "${{ matrix.runner }}" = "macos-latest" ]; then
            SYSTEM="aarch64-darwin"
          elif [ "${{ matrix.runner }}" = "ubuntu-24.04-arm" ]; then
            SYSTEM="aarch64-linux"
          else
            SYSTEM="x86_64-linux"
          fi

          NEW_VERSION=$(nix eval --raw ".#packages.${SYSTEM}.${PACKAGE}.version")
          NEW_REVISION=$(nix eval --raw ".#packages.${SYSTEM}.${PACKAGE}.src.rev" 2>/dev/null || echo "$NEW_VERSION")
          COMMITS=""

          # Compare source revisions when the package points at a GitHub repository.
          if [[ "$HOMEPAGE" =~ github\.com/([^/]+)/([^/?]+) ]]; then
            REPO="${BASH_REMATCH[1]}/${BASH_REMATCH[2]}"
            for OLD_REF in "$OLD_REVISION" "v$OLD_REVISION"; do
              for NEW_REF in "$NEW_REVISION" "v$NEW_REVISION"; do
                if COMMITS=$(gh api "repos/${REPO}/compare/${OLD_REF}...${NEW_REF}" \
                  --jq '.commits[-10:] | reverse | .[] | "- [`\(.sha[0:7])`](\(.html_url)) \(.commit.message | split("\n")[0])"' 2>/dev/null); then
                  break 2
                fi
                COMMITS=""
              done
            done
          fi

          if [ -z "$COMMITS" ]; then
            COMMITS="- Commit details are unavailable for this source."
          fi

          {
            printf 'Automated update of `%s` via [nix-update](https://github.com/Mic92/nix-update).\n\n' "$PACKAGE"
            printf '**Version:** `%s` -> `%s`\n\n' "$OLD_VERSION" "$NEW_VERSION"
            printf '**Recent commits:**\n%s\n\n' "$COMMITS"
            printf 'The `flake-check` workflow will validate the build. If all checks pass, this PR will be auto-merged.\n'
          } > "$RUNNER_TEMP/pr-body.md"

      - name: Create branch and commit
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B update/${{ matrix.package }}
          git add -A
          git commit -m "pkg: update ${{ matrix.package }}"
          git push -f origin update/${{ matrix.package }}

      - name: Create Pull Request
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          EXISTING_PR=$(gh pr list --head "update/${{ matrix.package }}" --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -n "$EXISTING_PR" ]; then
            gh pr edit "$EXISTING_PR" --body-file "$RUNNER_TEMP/pr-body.md"
            echo "Updated PR #$EXISTING_PR for update/${{ matrix.package }}"
          else
            gh pr create \
               --title "pkg: update ${{ matrix.package }}" \
               --body-file "$RUNNER_TEMP/pr-body.md" \
               --base master \
               --head "update/${{ matrix.package }}"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable automerge
        if: steps.changes.outputs.has_changes == 'true'
        run: gh pr merge --auto --squash "update/${{ matrix.package }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
