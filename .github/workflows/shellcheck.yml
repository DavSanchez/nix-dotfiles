name: ShellCheck

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Justfile'
      - 'scripts/*.sh'
      - '.github/workflows/shellcheck.yml'
  push:
    branches:
      - master
    paths:
      - 'Justfile'
      - 'scripts/*.sh'
      - '.github/workflows/shellcheck.yml'

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run ShellCheck
        run: nix run --inputs-from . nixpkgs#shellcheck -- scripts/*.sh
