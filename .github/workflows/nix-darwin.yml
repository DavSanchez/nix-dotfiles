name: Nix Darwin
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      changed: ${{ steps.changed.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check for relevant changes
        id: changed
        run: |
          # Manual dispatch always builds.
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PATTERN='^(hosts/darwin|modules/darwin|modules/home|home|lib|tests/darwin|pkgs|overlays)/|^flake\.(nix|lock)$'
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="$(git rev-parse HEAD^ 2>/dev/null || echo '')"
          fi
          if [ -z "$BASE" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE" HEAD | grep -Eq "$PATTERN"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Discover nix-darwin configs
        id: matrix
        run: |
          set -euo pipefail
          # Exclude CI helper configs (linux-builder bootstrap) from the build matrix.
          nix eval --json '.#darwinConfigurations' \
            --apply 'x: builtins.mapAttrs (n: v: v.pkgs.system) x' \
          | jq -c 'to_entries
              | map(select(.key != "linux-builder-bootstrap"))
              | map(.key as $host | .value as $system |
                { host: $host, system: $system, runner: (
                  if $system == "aarch64-darwin" then "macos-latest"
                  else error("unsupported system for nix-darwin: " + $system)
                  end
                )})' > matrix.json
          [ -s matrix.json ] || { echo "matrix is empty — nix eval failed" >&2; exit 1; }
          echo "matrix=$(cat matrix.json)" >> "$GITHUB_OUTPUT"

  build:
    needs: discover
    if: needs.discover.outputs.changed == 'true'
    name: Build nix-darwin (${{ matrix.host }})
    strategy:
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Free up space
        run: bash .github/scripts/space_cleanup.sh

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/cachix-action@v17
        with:
          name: davsanchez
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Backup existing system files
        run: |
          for f in /etc/nix/nix.conf /etc/bashrc /etc/zshrc; do
            if [ -f "$f" ]; then
              sudo mv "$f" "${f}.before-nix-darwin"
              echo "Renamed $f to ${f}.before-nix-darwin"
            fi
          done

      # Activate a minimal nix-darwin config that only enables the Linux builder VM.
      # This bootstrap builder is needed by our real nix-darwin configs (solio/sierpe/nr)
      # which configure their own Linux builder with x86_64 emulation support.
      - name: Activate bootstrap Linux builder
        run: >
          sudo nix run
          --access-tokens "github.com=${{ secrets.GITHUB_TOKEN }}"
          --extra-experimental-features 'nix-command flakes'
          github:nix-darwin/nix-darwin/master#darwin-rebuild
          --
          switch --max-jobs 1 --flake .#linux-builder-bootstrap

      - name: Smoke test Linux builder VM
        run: |
          set +e
          sleep 30 # give it time to the VM to spawn (software emulated)
          for i in $(seq 1 12); do
            echo "Attempt $i/12: building trivial aarch64-linux derivation..."
            nix build --system aarch64-linux \
              --expr 'builtins.derivation { name = "smoke-test"; system = "aarch64-linux"; builder = "/bin/sh"; args = ["-c" "echo ok > $out"]; }' \
              --no-link 2>&1
            if [ $? -eq 0 ]; then
              echo "Linux builder is responsive"
              exit 0
            fi
            echo "Attempt $i failed, waiting 5s for VM to boot..."
            sleep 5
          done

          echo "=== Linux builder failed to become responsive after 60s ==="
          echo ""
          echo "=== Launchd service status ==="
          sudo launchctl print system/org.nixos.linux-builder 2>&1 || true
          echo ""
          echo "=== Crash reports ==="
          for f in $(ls -t /Library/Logs/DiagnosticReports/qemu-system-aarch64*.ips 2>/dev/null | head -3); do
            echo "--- $f ---"
            sudo python3 -c "
          import json
          with open('$f') as fh:
              fh.readline()
              data = json.load(fh)
          print('Exception:', json.dumps(data.get('exception', {}), indent=2))
          print('Termination:', json.dumps(data.get('termination', {}), indent=2))
          ft = data.get('faultingThread', -1)
          if ft >= 0:
              thread = data['threads'][ft]
              print(f'Faulting thread: {ft} ({thread.get(\"name\", \"unknown\")})')
              for i, frame in enumerate(thread.get('frames', [])[:10]):
                  print(f'  {i}: {frame.get(\"symbol\", \"\")} (offset {frame.get(\"imageOffset\", \"\")})')
          " 2>&1 || sudo cat "$f" 2>&1 || echo "Could not read $f"
          done
          exit 1

      - name: Build nix-darwin (${{ matrix.host }})
        run: >
          nix run github:nix-darwin/nix-darwin/master#darwin-rebuild
          --access-tokens "github.com=${{ secrets.GITHUB_TOKEN }}"
          -- build --max-jobs 1 --keep-going --flake .#${{ matrix.host }}

  check:
    name: 🟢 Nix-Darwin builds successes required
    if: always()
    needs:
      - build
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
          # build is skipped when no relevant files changed (git-diff gate);
          # that's a legitimate "nothing to build" state, not a failure.
          allowed-skips: build
