version: 2
updates:
  # Flake inputs, one PR per outdated input.
  #
  # Dependabot's nix ecosystem parses flake.lock, runs `nix flake update
  # <input>` and opens one PR per input. That is reliable for branch inputs.
  # Tag-pinned inputs are excluded (see `ignore` below).
  - package-ecosystem: nix
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # Hermes also publishes an obsolete date-tag scheme (v2026.9.24 =
      # v0.21.5) whose tags sort above v0.22.x. Filter those so semver tags are
      # considered. Dependabot may still propose the tag *below* a pin that is
      # already the latest (#786, #788); the approve/auto-merge workflow treats
      # downgrades as semver-major, so they stay open instead of merging.
      - dependency-name: hermes-agent
        versions: [">= 2026.0.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
