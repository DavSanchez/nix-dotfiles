version: 2
updates:
  # Flake inputs, one PR per outdated input.
  #
  # Dependabot's nix ecosystem parses flake.lock, runs `nix flake update
  # <input>` and opens one PR per input. That is reliable for branch inputs.
  # Tag-pinned inputs are excluded (see `ignore` below).
  - package-ecosystem: nix
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # Dependabot's tag updater cannot handle a tag-pinned input whose tag is
      # already the latest. It first proposed v0.22.5 -> v2026.9.24 (#786, an
      # older date-tag release) and, with that filtered, v0.22.5 -> v0.22.4
      # (#788, the tag *below* the current one) instead of reporting no update.
      # Bump these by hand: change the tag, then `nix flake update <input>`.
      - dependency-name: hermes-agent
      - dependency-name: autolith

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
